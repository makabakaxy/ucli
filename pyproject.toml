[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ucli-tools"
version = "1.1.0"
description = "Turn MCP servers and local scripts into CLI commands and agent skills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "oliver.mengxy@gmail.com" },
]
keywords = [
    "mcp",
    "cli",
    "agent",
    "skill",
    "model-context-protocol",
    "llm",
    "ai-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
    "mcp>=1.30,<2",
]

[project.urls]
Homepage = "https://github.com/makabakaxy/ucli"
Repository = "https://github.com/makabakaxy/ucli"
Issues = "https://github.com/makabakaxy/ucli/issues"

[project.scripts]
ucli = "ucli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["ucli"]

[tool.hatch.build.targets.wheel.force-include]
"presets/ps" = "ucli/_presets/ps"

[tool.hatch.build.targets.sdist]
include = ["/ucli", "/presets/ps", "/docs", "/pyproject.toml", "/README.md", "/LICENSE", "/uv.lock"]
